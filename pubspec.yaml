name: opright_mobile
description: Opright Logistics - Flutter Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client
  dio: ^5.4.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Local storage
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.2.3

  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # WebSockets (Socket.IO)
  socket_io_client: ^2.0.3+1

  # In-app WebView for payment pages
  flutter_inappwebview: ^6.1.5

  # Image handling
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  # UI utilities
  intl: ^0.19.0
  timeago: ^3.6.0
  shimmer: ^3.0.0
  lottie: ^3.1.0

  # Environment
  flutter_dotenv: ^5.1.0

  # Icons
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.6

  # Typography
  google_fonts: ^6.2.1

  # Utilities
  equatable: ^2.0.5
  uuid: ^4.3.3
  url_launcher: ^6.2.6
  share_plus: ^13.0.0
  permission_handler: ^12.0.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  package_info_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.3.11

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - .env
